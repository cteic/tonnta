name: Code Checks

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Commitlint diffs base..head; needs full history, not a shallow clone.
          fetch-depth: 0
      # PR size (advisory): the dotfiles size checker, brought into the
      # repo so it has a call site. Non-blocking by design — a blocking size
      # check gets bypassed; the value is the split conversation on the PR.
      - name: PR size (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --quiet origin "$BASE:refs/remotes/origin/$BASE" || true
          bash scripts/pr-size-check.sh || true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workflow timeouts
        run: node scripts/check-workflow-timeouts.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:packages
      - run: pnpm build:web

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

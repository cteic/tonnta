name: Deploy

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tonnta/worker run deploy

  web:
    # Review-only drafts must not upload or deploy safety-sensitive changes.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy web worker (push) or upload preview version (PR)
        id: deploy
        working-directory: apps/web
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm run upload 2>&1 | tee deploy.log
            URL=$(grep -oE 'https://[a-z0-9-]+-tonnta-web[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          else
            pnpm run deploy 2>&1 | tee deploy.log
            URL=$(grep -oE 'https://tonnta-web[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `Preview deployment: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('Preview deployment:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  swim-web:
    # Review-only drafts must not upload or deploy safety-sensitive changes.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A preview upload needs the snamh-web worker to exist. Until the first
      # push deploy creates it, a failed preview must not fail the PR.
      - name: Deploy swim web worker (push) or upload preview version (PR)
        id: deploy
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        working-directory: apps/swim-web
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm run upload 2>&1 | tee deploy.log
            URL=$(grep -oE 'https://[a-z0-9-]+-snamh-web[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          else
            pnpm run deploy 2>&1 | tee deploy.log
            URL=$(grep -oE 'https://snamh-web[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment swim preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `Swim preview deployment: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('Swim preview deployment:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

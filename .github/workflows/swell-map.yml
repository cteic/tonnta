name: Swell map

# Fetches each new NOAA GFS-Wave run, encodes one data image per forecast
# step (scripts/swell-map), and uploads them to the R2 bucket the worker
# serves at /swell-map/. GFS-Wave publishes four runs a day; the last
# forecast hour lands about four to five hours after the run time.

on:
  schedule:
    - cron: '20 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      run:
        description: 'Model run YYYYMMDDHH (default: newest complete run)'
        required: false
  pull_request:
    paths:
      - 'scripts/swell-map/**'
      - '.github/workflows/swell-map.yml'

concurrency:
  group: swell-map-${{ github.event_name }}
  cancel-in-progress: false

env:
  WORKER_URL: https://tonnta-worker.pete-9c4.workers.dev

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/swell-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/swell-map/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: scripts/swell-map
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: tonnta-swell-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/swell-map/requirements.txt
      - run: pip install -r requirements.txt

      - name: Pick the run
        id: pick
        env:
          REQUESTED: ${{ inputs.run }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::R2 credentials are not set in the production environment; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$REQUESTED" ]; then
            run="$REQUESTED"
          else
            run=$(python build_run.py --out out --print-latest)
          fi
          published=$(curl -fsS "$WORKER_URL/swell-map/latest.json" | jq -r .run || true)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -z "$REQUESTED" ] && [ "$run" = "$published" ]; then
            echo "Run $run is already published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Encode
        if: steps.pick.outputs.skip != 'true'
        env:
          RUN: ${{ steps.pick.outputs.run }}
        run: python build_run.py --out out --run "$RUN"

      # Frames first, latest.json last, so a client never sees a manifest
      # that points at frames not yet uploaded.
      - name: Upload to R2
        if: steps.pick.outputs.skip != 'true'
        env:
          RUN: ${{ steps.pick.outputs.run }}
        run: |
          aws s3 cp "out/runs/$RUN" "s3://$BUCKET/runs/$RUN" --recursive --endpoint-url "$R2_ENDPOINT"
          aws s3 cp out/latest.json "s3://$BUCKET/latest.json" --content-type application/json --endpoint-url "$R2_ENDPOINT"

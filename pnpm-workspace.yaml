packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain baseline from cteic/foundry docs/install-policy.md.

# Refuse releases younger than 3 days, the same wait Renovate uses.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@cteic/*'
  # Expo SDK 58.1, published 2026-11-26, was in the lockfile before this policy.
  # Every entry below clears the 3-day wait on 2026-11-29. Delete them after that.
  - '@expo/cli@58.1.22' # Expo 58.1, clears 2026-11-29
  - '@expo/config-plugins@58.0.14' # Expo 58.1, clears 2026-11-29
  - '@expo/config@58.0.13' # Expo 58.1, clears 2026-11-29
  - '@expo/fingerprint@0.22.0' # Expo 58.1, clears 2026-11-29
  - '@expo/inline-modules@0.2.11' # Expo 58.1, clears 2026-11-29
  - '@expo/local-build-cache-provider@58.0.13' # Expo 58.1, clears 2026-11-29
  - '@expo/metro-config@58.0.24' # Expo 58.1, clears 2026-11-29
  - '@expo/metro-file-map@58.0.7' # Expo 58.1, clears 2026-11-29
  - '@expo/prebuild-config@58.0.21' # Expo 58.1, clears 2026-11-29
  - '@expo/router-server@58.0.24' # Expo 58.1, clears 2026-11-29
  - '@expo/ui@58.0.30' # Expo 58.1, clears 2026-11-29
  - 'babel-preset-expo@58.0.27' # Expo 58.1, clears 2026-11-29
  - 'expo-file-system@58.0.15' # Expo 58.1, clears 2026-11-29
  - 'expo-glass-effect@58.0.6' # Expo 58.1, clears 2026-11-29
  - 'expo-modules-core@58.2.0' # Expo 58.1, clears 2026-11-29
  - 'expo-modules-jsi@58.0.24' # Expo 58.1, clears 2026-11-29
  - 'expo-router@58.0.33' # Expo 58.1, clears 2026-11-29
  - 'expo-splash-screen@58.0.15' # Expo 58.1, clears 2026-11-29
  - 'expo-updates@58.0.23' # Expo 58.1, clears 2026-11-29
  - 'expo-widgets@58.0.30' # Expo 58.1, clears 2026-11-29
  - 'expo@58.1.0' # Expo 58.1, clears 2026-11-29
minimumReleaseAgeStrict: true

# Fail the install when a dependency has an install script nobody approved.
strictDepBuilds: true

# Fail the install when a release has weaker provenance than earlier ones.
trustPolicy: no-downgrade
# Each entry below is an old maintenance-line release that was already in the
# lockfile. Newer lines of the same package ship with provenance, so pnpm reads
# these as a trust downgrade. Publish dates are from the npm registry.
trustPolicyExclude:
  - 'semver@6.3.1' # 6.x line, published 2023-07-10
  - 'synckit@0.9.3' # 0.9.x line, published 2025-05-30
  - 'ua-parser-js@0.7.41 || 1.0.41' # 0.7.x and 1.x lines, published 2025-08-19
  - 'undici-types@6.21.0' # 6.x line, published 2024-11-13
  - 'vite@5.4.21' # 5.x line, published 2025-10-20

# Only direct dependencies may come from git or tarball URLs.
blockExoticSubdeps: true

# Packages allowed to run install scripts. pnpm fails on any other script.
allowBuilds:
  # postinstall checks that the platform binary from @esbuild/* is present and
  # fetches it if the optional dependency was skipped. Used by Vite, tsx and wrangler.
  esbuild: true
  # postinstall does the same for the workerd binary that wrangler runs locally.
  workerd: true
  # The install script only checks for the prebuilt @img/sharp-* binary, which
  # installs as an optional dependency. Building from source is never wanted.
  sharp: false

engineStrict: true

overrides:
  '@types/react': '^19.0.0'
  '@types/react-dom': '^19.0.0'
  react-native-web: '^0.21.4'
  react-native: 0.88.1
  react: 19.3.0
  react-dom: 19.3.0
  body-parser: '^2.4.0'
  proxy-addr: '^2.0.8'
  shell-quote: '^1.11.0'
  node-forge: '^1.4.1'
  browserslist: '^4.28.7'
  postcss: '^8.5.18'
  source-map-js: '^1.2.2'
  'brace-expansion@1': '^1.1.22'
  'brace-expansion@2': '^2.1.8'
  'brace-expansion@5': '^5.0.13'
  'fast-uri@3': '^3.1.7'
  'glob@10': '^10.5.0'
  'js-yaml@4': '^4.3.2'
  'piscina@4': '^4.9.4'
  'undici@6': '^6.29.1'
  'undici@7': '^7.30.1'
  'vite@7': '^7.3.7'

patchedDependencies:
  'tamagui-loader@2.0.0-rc.42': patches/tamagui-loader@2.0.0-rc.42.patch
  '@tamagui/next-plugin@2.0.0-rc.42': patches/@tamagui__next-plugin@2.0.0-rc.42.patch
  '@tamagui/web@2.0.0-rc.42': patches/@tamagui__web@2.0.0-rc.42.patch
